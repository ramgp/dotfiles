format = """
$directory\
$fill\
$git_branch\
$git_commit\
$git_status\
$shell\
$time\
$username\
$line_break\
$cmd_duration$character\
"""

palette = "catppuccin_mocha"
# Fish: set -gx STARSHIP_THEME rose_pine; set -e STARSHIP_THEME restores Mocha.
add_newline = true
continuation_prompt = '[❯❯](bold green) '

[directory]
format = '[ $read_only$truncation_symbol$path](fg:background_alt bg:secondary)[](fg:secondary)'
home_symbol = " ~"
truncation_symbol = '󰷏 ../'
truncation_length = 4
truncate_to_repo = false
read_only = ' '
read_only_style = ''

[git_branch]
format = '(fg:foreground)[](fg:primary)[$symbol](fg:background_alt bg:primary)[]($style)[$branch]($style)'
style = "fg:primary bg:surface"
symbol = ''
# symbol = ' '
only_attached = true
ignore_branches = []
truncation_length = 25
truncation_symbol = "..."
always_show_remote = false
disabled = false

[git_commit]
format = "(fg:foreground)[](fg:primary)[](fg:background_alt bg:primary)[]($style)([($tag)(@$hash)]($style))"
style = "fg:primary bg:surface"
commit_hash_length = 7
only_detached = true
tag_symbol = "󰓼 "
tag_disabled = false
disabled = false

[git_status]
style = "fg:info bg:surface"
format = '([$ahead_behind]($style))([$all_status]($style))[](fg:surface)'
stashed = '[ *${count}](fg:accent_alt bg:surface)'
ahead = " ⇡${count}"
behind = " ⇣${count}"
up_to_date = ""
diverged = " ⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
deleted = "[ ×${count}](fg:error bg:surface)"
renamed = "[ »${count}](fg:success bg:surface)"
modified = "[ !${count}](fg:warning bg:surface)"
staged = "[ +${count}](fg:success bg:surface)"
untracked = " ?${count}"
ignore_submodules = false
disabled = false

[git_metrics]
format = '([([+$added]($added_style))([-$deleted]($deleted_style))](fg:foreground) )'
added_style = "fg:primary"
deleted_style = "fg:tertiary"
only_nonzero_diffs = true
disabled = false

[nodejs]
format = '(fg:foreground)[█](fg:info)[$symbol](fg:background_alt bg:info)[](fg:info bg:surface)[ $version](fg:info bg:surface)[](fg:surface)'
symbol = ' '
detect_files = ["package.json", ".node-version", "!bunfig.toml", "!bun.lockb"]

[fill]
symbol = ' '
style = 'fg:foreground'

[cmd_duration]
min_time = 500
# show_milliseconds = true
# format = " in $duration "
# format = '(fg:foreground)[](fg:tertiary)[ ](fg:background_alt bg:tertiary)[ $duration]($style)[](fg:muted)[ ](fg:foreground)'
format = '(fg:foreground)[](fg:tertiary)[ ](fg:surface bg:tertiary)[ $duration]($style)[](fg:surface)[ ](fg:foreground)'
style = "fg:tertiary bg:surface"
disabled = false
show_notifications = false
min_time_to_notify = 45000

[shell]
fish_indicator = ''
bash_indicator = ''
zsh_indicator = ''
format = '(fg:foreground)[](fg:accent)[$indicator ](fg:background_alt bg:accent)[](fg:accent)'
disabled = false

[time]
format = '(fg:foreground)[](fg:subtle)[](fg:background_alt bg:subtle)[](fg:subtle bg:surface)[$time](bold fg:subtle bg:surface)[█](fg:surface)'
time_format = '%H:%M'
disabled = false

[custom.time]
format = '[＠](fg:background_alt bg:muted)[ $output ](fg:muted bg:surface_alt)[](fg:surface_alt)'
command = "date +%T"
style = "bold fg:foreground bg:surface"
when = true

[username]
format = '(fg:foreground)[](fg:tertiary)[ ](fg:background_alt bg:tertiary)[](fg:tertiary bg:surface)[$user](fg:tertiary bg:surface)[](fg:surface) '
show_always = false

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vicmd_symbol = "[𝛌](bold fg:tertiary)"
vimcmd_replace_one_symbol = '[𝛌](bold fg:warning)'
vimcmd_replace_symbol = '[𝛌](bold fg:warning)'
vimcmd_visual_symbol = '[𝛌](bold fg:accent)'

#
# Semantic colors used by the prompt:
#
# primary         Main positive/accent color
# secondary       Secondary accent
# tertiary        Third accent / attention
# accent          Highlight / special accent
# success         Successful state
# error           Error / destructive state
# warning         Warning / attention state
# foreground      Primary text
# foreground_muted Secondary text
# muted           Muted text
# subtle          Subtle text
# surface         Main segment background
# surface_alt     Alternate segment background
# background      Main theme background
# background_alt  Darker background

[palettes.catppuccin_mocha]
primary = "#a6e3a1"    # green
secondary = "#89b4fa"  # blue
tertiary = "#f9e2af"   # yellow
accent = "#b4befe"     # lavender
accent_alt = "#cba6f7" # mauve
info = "#89dceb"       # sky

success = "#a6e3a1" # green
error = "#f38ba8"   # red
warning = "#f9e2af" # yellow

foreground = "#cdd6f4"       # text
foreground_muted = "#bac2de" # subtext1
muted = "#a6adc8"            # subtext0
subtle = "#9399b2"           # overlay2

surface = "#313244"     # surface0
surface_alt = "#45475a" # surface1

background = "#1e1e2e"     # base
background_alt = "#181825" # mantle


[palettes.rose_pine]
primary = "#31748f"   # pine
secondary = "#9ccfd8" # foam
tertiary = "#f6c177"  # gold
accent = "#c4a7e7"    # iris
accent_alt = "#ebbcba" # rose
info = "#9ccfd8"      # foam

success = "#9ccfd8" # foam
error = "#eb6f92"   # love
warning = "#f6c177" # gold

foreground = "#e0def4"       # text
foreground_muted = "#908caa" # subtle
muted = "#6e6a86"            # muted
subtle = "#908caa"           # subtle

surface = "#1f1d2e"     # surface
surface_alt = "#26233a" # overlay

background = "#191724"     # base
background_alt = "#21202e" # highlight-low
