# config ref: https://github.com/codingjerk/dotfiles

set-option -sa terminal-overrides ",xterm*:Tc"
set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000  # increase "prefix-free" window

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Theme: borders
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
# set -g pane-active-border-style fg=magenta

# Theme: status
set -g status-style "bg=default,fg=black,bright"
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"
# set -g @mode_indicator_copy_mode_style "fg=white,bg=green,bright"
# set-hook -g 'pane-mode-changed' 'set -gF status-style "bg=#{?#{==:#{pane_mode},copy-mode},yellow,default}"'
# set-hook -g 'pane-mode-changed' 'set -gF status-style "bg=#{?#{==:#{pane_mode},copy-mode},yellow,default},fg=#{?#{==:#{pane_mode},copy-mode},black,default}"'
setw -g mode-style "fg=black bg=white"

# Theme: status (windows)
set -g window-status-format " #I:#W "
# set -g window-status-current-format "● #W"
set -g window-status-current-format "#{?window_zoomed_flag,#[fg=yellow]● #W,● #W}"

set -g window-status-current-style "fg=purple,nobold"
set -g window-status-bell-style "fg=red,nobold"

setw -g mode-keys vi

bind-key -T copy-mode-vi "y" send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

set -g status-position top

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

bind c new-window -c "#{pane_current_path}"

# replace split-window bind to - and |
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
